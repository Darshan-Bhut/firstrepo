name: MediCare CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking MediCare Hospital project..."
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Validate HTML
        run: |
          grep -q "<!DOCTYPE html>" index.html
          grep -q "<html" index.html
          grep -q "</html>" index.html

      - name: Check CSS
        run: |
          test -s style.css

      - name: Check JavaScript
        run: |
          test -s script.js

      - name: Build completed
        run: |
          echo "CI checks completed successfully."
